---
name: 'Release Workflows'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v2.*'
      - '!v1.*'

  # No pull_request trigger: tests.yml's library job already rehearses this
  # exact release on every PR.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  ci:
    # Normally don't use a workflow without the @{ref}.  In this case, we want
    # to run the workflow specified by the branch instead of what is associated
    # with a reference so we can test that the change works.
    uses: ./.github/workflows/ci.yml
    with:
      # Real release on a version tag; otherwise rehearse it against a tag
      # that only exists on the runner (nothing is tagged or published).
      release-simulate-tag: ${{ !startsWith(github.ref, 'refs/tags/') && format('v0.0.{0}', github.run_number) || '' }}
      build-skip:           true
      lint-skip:            true
      license-skip:         true
      copyright-skip:       true
      style-skip:           true
      tests-skip:           true
      working-directory:    library
      release-type:         library
      release-project-name: library
    secrets: inherit
