---
name: 'Automatically relase patch versions.'

on:
  schedule: # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions:  write   # lets the release job dispatch release-workflows.yml
    uses: ./.github/workflows/auto-releaser.yml
    with:
      tag-filter: '^(?!v1[.]).*$'
      release-ignore-paths: ""
      release-workflow: release-workflows.yml
    secrets: inherit
